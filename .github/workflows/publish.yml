name: publish

# Publishing uses npm trusted publishing, so no token is stored anywhere. The
# registry trusts this workflow in this repository through OIDC, and provenance
# is attached automatically.
#
# One time setup, on npmjs.com: Packages -> supercompact -> Settings ->
# Trusted Publisher -> GitHub Actions, owner SignedAdam, repository
# supercompact, workflow file publish.yml, allow publish. It needs an
# interactive 2FA approval, so it cannot be scripted.
#
# Then a release is: npm version patch|minor|major && git push --follow-tags

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # setup-node pins npm 10, which has no OIDC support. Trusted publishing
      # needs 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - run: npm install
      - run: npm run check

      - name: Refuse to publish a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi

      # Re-running a tag, or tagging a version that was published by hand, must
      # not fail the run.
      - name: Skip a version the registry already has
        id: exists
        run: |
          pkg=$(node -p "require('./package.json').version")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/supercompact/$pkg")
          if [ "$code" = "200" ]; then
            echo "supercompact@$pkg is already on the registry, nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: |
          if npm publish --access public; then exit 0; fi
          echo "::error::npm publish failed. If that was an authentication error, this repository is not yet registered as a trusted publisher, and there is no token here on purpose. Configure it once on npmjs.com: Packages -> supercompact -> Settings -> Trusted Publisher -> GitHub Actions, owner SignedAdam, repository supercompact, workflow publish.yml, allow publish. It needs an interactive 2FA approval, so it cannot be scripted. Until then, release from a laptop with scripts/release.sh."
          exit 1
